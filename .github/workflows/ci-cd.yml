name: CI-CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar dependencias
        run: pip install -r requirements.txt
      - name: Pruebas
        run: pytest -q
      - name: Validar CSV
        run: python scripts/validar.py
      - name: Generar sitio e informe
        run: python scripts/generar_informes.py
      - name: Subir artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  cd:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Mostrar enlace del sitio
        run: |
          echo "Sitio publicado: ${{ steps.deployment.outputs.page_url }}"
          {
            echo "## Sitio desplegado"
            echo ""
            echo "**Enlace:** ${{ steps.deployment.outputs.page_url }}"
            echo ""
            echo "**Commit:** \`${GITHUB_SHA::7}\`"
            echo ""
            echo "**Ejecución:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"